        isPermaLink=\"true\">https://weekly.tw93.fun/posts/210-%E9%9C%87%E6%92%BC%E7%83%9F%E5%9B%B1/</guid><description>&lt;img
        src=&quot;https://cdn.fliggy.com/uPic/21022.jpg?x-oss-process=image/resize,w_3600/format,webp&quot;
        width=&quot;800&quot;&gt;\n&lt;p&gt;&lt;small&gt;\u5C01\u9762\u56FE\u62CD\u6444\u4E8E\u5728\u897F\u5B89\u53BB\u54B8\u9633\u673A\u573A\u8DEF\u4E0A\u6240\u62CD\uFF0C\u597D\u4E45\u6CA1\u6709\u770B\u8FC7\u8FD9\u79CD\u5927\u70DF\u56F1\u4E86\uFF0C\u975E\u5E38\u4E4B\u5927\uFF0C\u633A\u9707\u64BC\u3002&lt;/small&gt;&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;strong&gt;\u8BB0\u5F55\u6BCF\u5468\u770B\u5230\u7684\u63A5\u5730\u6C14\u7684\u6F6E\u6D41\u6280\u672F\uFF0C\u7B5B\u9009\u540E\u53D1\u5E03\u4E8E\u6B64\uFF0C\u89C9\u5F97\u4E0D\u9519\u53EF\u5173\u6CE8\u6B64\u5468\u520A\uFF0C\u65B9\u4FBF\u83B7\u53D6\u66F4\u65B0\u901A\u77E5&lt;/strong&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2
        id=&quot;\u6F6E\u6D41\u5DE5\u5177&quot;&gt;\u6F6E\u6D41\u5DE5\u5177&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;\u5F00\u6E90\u4E66\u7C4D\u5927\u6A21\u578B\u57FA\u7840\u503C\u5F97\u4E00\u770B&lt;/strong&gt;&lt;br&gt;\n&lt;a
        href=&quot;https://github.com/ZJU-LLMs/Foundations-of-LLMs&quot;&gt;https://github.com/ZJU-LLMs/Foundations-of-LLMs&lt;/a&gt;&lt;br&gt;\n\u6D59\u6C5F\u5927\u5B66\u51FA\u7684\u8FD9\u4E2A\u5F00\u6E90\u7684\u4E66\u7C4D\u300C\u5927\u6A21\u578B\u57FA\u7840\u300D\u503C\u5F97\u4E00\u770B\uFF0C\u884C\u6587\u98CE\u683C\u633A\u4E0D\u9519\u7684\uFF0C\u6613\u8BFB\u3001\u4E25\u8C28\u3001\u6709\u6DF1\u5EA6\u7684\u5927\u6A21\u578B\u6559\u6750\u3002&lt;br&gt;\n&lt;img
        src=&quot;https://cdn.fliggy.com/uPic/4hQpdf22.png?x-oss-process=image/resize,w_3600/format,webp&quot;
        width=&quot;500&quot;&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;TheBoringNotch\uFF1A\u4E00\u4E2A\u5F00\u6E90\u7684
        Mac \u5218\u6D77\u5DE5\u5177&lt;/strong&gt;&lt;br&gt;\n&lt;a href=&quot;https://theboring.name/&quot;&gt;https://theboring.name/&lt;/a&gt;&lt;br&gt;\n\u53D1\u73B0\u4E00\u4E2A\u5F00\u6E90\u7684
        Mac \u5218\u6D77\u5DE5\u5177\uFF0C\u76F8\u6BD4\u6CA1\u6709\u5565\u7528\u7684\u4E00\u5757\u9ED1\u7684\uFF0C\u4ED6\u8BA9\u8FD9\u4E2A\u53D8\u6210\u4E86\u7C7B\u4F3C\u7075\u52A8\u5C9B\u7684\u529F\u80FD\u533A\uFF0C\u867D\u7136\u6211\u611F\u89C9
        iPhone \u7684\u7075\u52A8\u5C9B\u5176\u5B9E\u4E5F\u975E\u5E38\u4E11\uFF0C\u4E0D\u8FC7\u8FD9\u4E2A\u5DE5\u5177
        TheBoringNotch \u8BA9\u8FD9\u4E00\u5757\u7EC6\u817B\u4E86\u5F88\u591A\uFF0C\u6BD4\u5982\u8BF4\u97F3\u4E50\u7684\u5207\u6362\u3001\u65E5\u7A0B\u7684\u67E5\u770B\u7B49\u5F88\u65B9\u4FBF\uFF0C\u671F\u5F85\u540E\u9762\u8D8A\u6765\u8D8A\u591A\u7684\u65B0\u529F\u80FD\u3002&lt;br&gt;\n&lt;img
        src=&quot;https://cdn.fliggy.com/uPic/mac22.gif&quot; width=&quot;800&quot;&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;\u5728
        pdf \u6587\u4EF6\u91CC\u9762\u73A9\u4FC4\u7F57\u65AF\u65B9\u5757\u600E\u4E48\u5B9E\u73B0\u7684\uFF1F&lt;/strong&gt;&lt;br&gt;\n&lt;a
        href=&quot;https://th0mas.nl/downloads/pdftris.pdf&quot;&gt;https://th0mas.nl/downloads/pdftris.pdf&lt;/a&gt;&lt;br&gt;\n\u597D\u795E\u5947\uFF0C\u5BF9\uFF0C\u4F60\u6CA1\u6709\u770B\u9519\uFF0C\u662F\u5728
        pdf \u6587\u4EF6\u91CC\u9762\u73A9\u4FC4\u7F57\u65AF\u65B9\u5757\uFF0C\u53EF\u4EE5\u53BB\u7814\u7A76\u7814\u7A76\u5982\u4F55\u5B9E\u73B0\u7684\uFF0C\u8FD9\u4E2A\u6709\u70B9\u7A81\u7834\u6211\u539F\u6709\u7684\u60F3\u6CD5\uFF0C\u4E0D\u8FC7\u597D\u6BD4\u5728
        Excel \u91CC\u9762\u5176\u5B9E\u4E5F\u53EF\u4EE5\u505A\u5927\u91CF\u6709\u8DA3\u7684\u4E8B\u60C5\u3002&lt;br&gt;\n&lt;img
        src=&quot;https://cdn.fliggy.com/uPic/SCR-20250209-rmus22.png?x-oss-process=image/resize,w_3600/format,webp&quot;
        width=&quot;800&quot;&gt;&lt;/p&gt;\n&lt;h2 id=&quot;\u968F\u4FBF\u770B\u770B&quot;&gt;\u968F\u4FBF\u770B\u770B&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;\u770B\u5230\u4E00\u4E2A\u795E\u8FF9\u54EA\u5412\u753B&lt;/strong&gt;&lt;br&gt;\n&lt;a
        href=&quot;https://x.com/sheruff1010/status/1889772270052082094&quot;&gt;https://x.com/sheruff1010/status/1889772270052082094&lt;/a&gt;&lt;br&gt;\n\u753B\u5F97\u592A\u597D\u4E86\uFF0C\u6765\u6E90
        X\u300C\u9753\u4E3D\u8C5A\u9AA8\u300D,\u592A\u592A\u592A\u559C\u6B22\u4E86\uFF0C\u975E\u5E38\u559C\u6B22\u8FD9\u4E2A\u7248\u672C\u3002&lt;br&gt;\n&lt;img
        src=&quot;https://cdn.fliggy.com/uPic/WA5c9722.png?x-oss-process=image/resize,w_3600/format,webp&quot;
        width=&quot;500&quot;&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;B \u7AD9\u4E0A\u9762\u8FD9\u4E2A\u300C\u4F60\u7BA1\u8FD9\u7834\u73A9\u610F\u53EB\u7F51\u7EDC\uFF1F\u300D
        \u89C6\u9891\u5F88\u6709\u8DA3&lt;/strong&gt;&lt;br&gt;\n&lt;a href=&quot;https://www.bilibili.com/video/BV17x6hYZEzJ/&quot;&gt;https://www.bilibili.com/video/BV17x6hYZEzJ/&lt;/a&gt;&lt;br&gt;\n\u4E00\u4E2A\u7B80\u5355\u89C6\u9891\u628A\u8BA1\u7B97\u673A\u7F51\u7EDC\u57FA\u7840\u8BB2\u5F97\u542C\u660E\u767D\uFF0C\u76F8\u6BD4\u73B0\u5728
        AI \u9AD8\u901F\u53D1\u5C55\u4E0B\u4EA7\u751F\u7684 AI \u539F\u751F\u7F16\u7A0B\u4F1A\u5F88\u4E0D\u4E00\u6837\uFF0C\u6709\u4E00\u79CD\u56DE\u5230\u5927\u5B66\u65F6\u4EE3\u5B66\u4E60\u8BA1\u7B97\u673A\u57FA\u7840\u7684\u90A3\u79CD\u8DA3\u5473\u611F\uFF0C\u611F\u5174\u8DA3\u7684\u53EF\u4EE5\u4E00\u952E\u4E09\u8FDE\u3002&lt;br&gt;\n&lt;img
