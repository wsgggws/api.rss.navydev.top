name: Deploy

# on: [push, pull_request]
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-navydev-top-api-rss
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v7

      - name: 📄 Create .env file and Copy .env to server via SCP
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: 📤 Copy project files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".,!notes,!tests,!png,!.git,!.github,!.env.ci,!.env.local"
          target: "deploy/navydev.top_api.rss/"
          strip_components: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }} <<'EOF'
            set -euo pipefail
            cd deploy/navydev.top_api.rss/
            bash scripts/migrate-legacy-data.sh
            make docker-run
          EOF
